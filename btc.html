<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>BTC/PHP Live Price - Coins.ph</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen {
      width: 100%;
      height: 100%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .pair {
      font-size: clamp(20px, 4vw, 52px);
      letter-spacing: 0.14em;
      font-weight: 700;
      opacity: 0.85;
      margin-bottom: 24px;
    }

    .price {
      font-size: clamp(52px, 15vw, 210px);
      font-weight: 900;
      line-height: 0.95;
      margin-bottom: 28px;
      word-break: break-word;
    }

    .change {
      font-size: clamp(24px, 5vw, 70px);
      font-weight: 700;
      margin-bottom: 28px;
    }

    .change.up {
      color: #30d158;
    }

    .change.down {
      color: #ff453a;
    }

    .details {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px;
      font-size: clamp(15px, 2.4vw, 30px);
      opacity: 0.85;
      margin-bottom: 30px;
    }

    .status {
      font-size: clamp(13px, 2vw, 22px);
      opacity: 0.65;
      min-height: 28px;
      margin-bottom: 24px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      background: #fff;
      color: #000;
      border: 0;
      border-radius: 999px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }

    .footer {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 10px;
      text-align: center;
      font-size: 12px;
      opacity: 0.45;
    }

    @media (max-width: 520px) {
      .screen {
        padding: 14px;
      }

      .buttons {
        width: 100%;
        max-width: 320px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="screen">
    <div class="pair">COINS.PH BTC/PHP</div>

    <div id="price" class="price">Connecting...</div>

    <div id="change" class="change">24H --</div>

    <div class="details">
      <div>Bid: <span id="bid">--</span></div>
      <div>Ask: <span id="ask">--</span></div>
      <div>High: <span id="high">--</span></div>
      <div>Low: <span id="low">--</span></div>
    </div>

    <div id="status" class="status">Opening Coins.ph live stream...</div>

    <div class="buttons">
      <button type="button" onclick="manualReconnect()">Reconnect</button>
      <button type="button" onclick="goFullscreen()">Fullscreen</button>
      <button type="button" onclick="keepScreenAwake()">Keep Screen On</button>
    </div>

    <div class="footer">
      Live data from Coins.ph public market API. Tap Keep Screen On and Fullscreen for monitor mode.
    </div>
  </main>

  <script>
    const SYMBOL = "BTCPHP";
    const STREAM_SYMBOL = SYMBOL.toLowerCase();

    /*
      Coins.ph docs:
      Base WSS: wss://wsapi.pro.coins.ph
      Raw stream: /openapi/quote/ws/v3/<streamName>
      Ticker stream: <symbol>@ticker
    */
    const WS_URL =
      `wss://wsapi.pro.coins.ph/openapi/quote/ws/v3/${STREAM_SYMBOL}@ticker`;

    /*
      Coins.ph public REST base:
      https://api.pro.coins.ph
      24hr ticker:
      /openapi/quote/v1/ticker/24hr?symbol=BTCPHP
    */
    const REST_24H_URL =
      `https://api.pro.coins.ph/openapi/quote/v1/ticker/24hr?symbol=${SYMBOL}`;

    const priceEl = document.getElementById("price");
    const changeEl = document.getElementById("change");
    const bidEl = document.getElementById("bid");
    const askEl = document.getElementById("ask");
    const highEl = document.getElementById("high");
    const lowEl = document.getElementById("low");
    const statusEl = document.getElementById("status");

    let socket = null;
    let wakeLock = null;

    let reconnectTimer = null;
    let pingTimer = null;
    let restPollTimer = null;

    let reconnectAttempts = 0;
    let manualClose = false;
    let lastLiveUpdateAt = 0;

    function formatPHP(value) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "--";
      }

      return new Intl.NumberFormat("en-PH", {
        style: "currency",
        currency: "PHP",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(number);
    }

    function formatPercent(value) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "--";
      }

      const sign = number > 0 ? "+" : "";
      return `${sign}${number.toFixed(2)}%`;
    }

    function normalizeTickerPayload(payload) {
      /*
        Raw stream payload:
        {
          e, E, s, p, P, c, b, a, h, l, ...
        }

        Combined stream payload:
        {
          stream: "btcphp@ticker",
          data: { ...tickerPayload }
        }

        REST payload:
        {
          symbol, priceChangePercent, lastPrice, bidPrice, askPrice, highPrice, lowPrice
        }

        REST can also return an array if the API changes or if symbols are used.
      */

      let data = payload;

      if (data && data.data) {
        data = data.data;
      }

      if (Array.isArray(data)) {
        data = data.find(item => String(item.symbol || item.s).toUpperCase() === SYMBOL) || data[0];
      }

      if (!data || typeof data !== "object") {
        return null;
      }

      return {
        symbol: data.s || data.symbol || SYMBOL,
        last: data.c || data.lastPrice || data.price,
        changePercent: data.P || data.priceChangePercent,
        bid: data.b || data.bidPrice,
        ask: data.a || data.askPrice,
        high: data.h || data.highPrice,
        low: data.l || data.lowPrice,
        eventTime: data.E || data.closeTime || Date.now()
      };
    }

    function updateDisplay(payload, source = "Live") {
      const ticker = normalizeTickerPayload(payload);

      if (!ticker) {
        console.warn("Unsupported ticker payload:", payload);
        return;
      }

      priceEl.textContent = formatPHP(ticker.last);
      changeEl.textContent = `24H ${formatPercent(ticker.changePercent)}`;

      const changeNumber = Number(ticker.changePercent);
      changeEl.classList.toggle("up", Number.isFinite(changeNumber) && changeNumber > 0);
      changeEl.classList.toggle("down", Number.isFinite(changeNumber) && changeNumber < 0);

      bidEl.textContent = formatPHP(ticker.bid);
      askEl.textContent = formatPHP(ticker.ask);
      highEl.textContent = formatPHP(ticker.high);
      lowEl.textContent = formatPHP(ticker.low);

      lastLiveUpdateAt = Date.now();

      statusEl.textContent =
        `${source} | Last update: ${new Date().toLocaleTimeString()}`;
    }

    async function loadRestData(source = "REST fallback") {
      const url = `${REST_24H_URL}&_=${Date.now()}`;

      const response = await fetch(url, {
        method: "GET",
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(`REST HTTP ${response.status}`);
      }

      const data = await response.json();
      updateDisplay(data, source);
    }

    async function loadInitialRestData() {
      try {
        await loadRestData("REST");
      } catch (error) {
        console.warn("Initial REST load failed:", error);
        statusEl.textContent = "REST failed. Waiting for WebSocket live price...";
      }
    }

    function startRestFallbackPolling() {
      clearInterval(restPollTimer);

      restPollTimer = setInterval(async () => {
        /*
          If WebSocket has not delivered data for 20 seconds,
          use REST so the page still works on networks/browsers
          that block WebSocket traffic.
        */
        const stale = Date.now() - lastLiveUpdateAt > 20000;

        if (!stale) {
          return;
        }

        try {
          await loadRestData("REST fallback");
        } catch (error) {
          console.warn("REST fallback polling failed:", error);
        }
      }, 15000);
    }

    function cleanupSocket() {
      clearTimeout(reconnectTimer);
      clearInterval(pingTimer);

      reconnectTimer = null;
      pingTimer = null;

      if (socket) {
        socket.onopen = null;
        socket.onmessage = null;
        socket.onerror = null;
        socket.onclose = null;

        try {
          socket.close();
        } catch (error) {
          console.warn(error);
        }

        socket = null;
      }
    }

    function connectSocket() {
      cleanupSocket();

      manualClose = false;
      statusEl.textContent = "Connecting to Coins.ph WebSocket...";

      try {
        socket = new WebSocket(WS_URL);
      } catch (error) {
        console.error("WebSocket constructor failed:", error);
        scheduleReconnect();
        return;
      }

      socket.onopen = () => {
        reconnectAttempts = 0;
        statusEl.textContent = "Connected. Waiting for live BTC/PHP price...";

        /*
          Browser JavaScript cannot send native WebSocket ping frames.
          Coins.ph documents JSON ping/pong messages, so we send this
          every 2 minutes, safely under the 5-minute disconnect window.
        */
        pingTimer = setInterval(() => {
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ ping: Date.now() }));
          }
        }, 120000);
      };

      socket.onmessage = event => {
        try {
          const payload = JSON.parse(event.data);

          if (payload.pong) {
            return;
          }

          if (payload.result === null && payload.id) {
            return;
          }

          if (payload.code || payload.msg || payload.desc) {
            console.warn("Coins.ph WebSocket message:", payload);
            statusEl.textContent = payload.msg || payload.desc || "WebSocket returned a message.";
            return;
          }

          updateDisplay(payload, "Live");
        } catch (error) {
          console.warn("Bad WebSocket message:", event.data, error);
        }
      };

      socket.onerror = error => {
        console.error("WebSocket error:", error);
        statusEl.textContent = "WebSocket error. Trying REST fallback...";
      };

      socket.onclose = event => {
        clearInterval(pingTimer);

        if (manualClose) {
          return;
        }

        console.warn("WebSocket closed:", event.code, event.reason);
        scheduleReconnect();
      };
    }

    function scheduleReconnect() {
      reconnectAttempts += 1;

      const delay = Math.min(30000, 3000 * reconnectAttempts);

      statusEl.textContent =
        `Disconnected. Reconnecting in ${Math.round(delay / 1000)}s...`;

      clearTimeout(reconnectTimer);

      reconnectTimer = setTimeout(() => {
        connectSocket();
      }, delay);
    }

    function manualReconnect() {
      manualClose = true;
      reconnectAttempts = 0;
      cleanupSocket();
      loadInitialRestData();
      connectSocket();
    }

    async function goFullscreen() {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
      } catch (error) {
        console.error(error);
        statusEl.textContent =
          "Fullscreen blocked. Tap the button again or check browser settings.";
      }
    }

    async function keepScreenAwake() {
      try {
        if (!("wakeLock" in navigator)) {
          statusEl.textContent =
            "Screen Wake Lock is not supported on this browser.";
          return;
        }

        wakeLock = await navigator.wakeLock.request("screen");

        wakeLock.addEventListener("release", () => {
          wakeLock = null;
          statusEl.textContent = "Screen wake lock released.";
        });

        statusEl.textContent = "Screen wake lock active.";
      } catch (error) {
        console.error(error);
        statusEl.textContent =
          "Wake lock failed. Use fullscreen and keep the device plugged in.";
      }
    }

    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState === "visible" && wakeLock === null) {
        try {
          await keepScreenAwake();
        } catch (error) {
          console.warn(error);
        }
      }
    });

    window.addEventListener("beforeunload", () => {
      manualClose = true;
      cleanupSocket();
      clearInterval(restPollTimer);
    });

    loadInitialRestData();
    startRestFallbackPolling();
    connectSocket();
  </script>
</body>
</html>
