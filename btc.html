<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />

  <title>BTC/PHP XRP/PHP</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      height: 100vh;
      height: 100svh;
    }

    .app {
      width: 100%;
      height: 100%;
      padding: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .time {
      position: fixed;
      top: 16px;
      right: 18px;
      font-size: clamp(12px, 3vw, 20px);
      font-weight: 800;
      opacity: 0.55;
      z-index: 5;
    }

    .price {
      width: 100%;
      font-size: clamp(46px, 13.2vw, 168px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.05em;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .xrp-price {
      margin-top: 18px;
      width: 100%;
      font-size: clamp(32px, 8vw, 96px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.05em;
      opacity: 0.78;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .controls {
      position: fixed;
      right: 14px;
      bottom: 14px;
      display: flex;
      gap: 10px;
      z-index: 5;
    }

    button {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      font-size: 23px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:active {
      transform: scale(0.94);
      background: rgba(255, 255, 255, 0.24);
    }

    .dot {
      position: fixed;
      left: 18px;
      bottom: 33px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #666;
      z-index: 5;
    }

    .dot.live {
      background: #30d158;
    }

    .dot.warn {
      background: #ff9f0a;
    }

    .dot.dead {
      background: #ff453a;
    }

    @media (max-width: 430px) {
      .app {
        padding: 16px;
      }

      .price {
        font-size: clamp(41px, 14.4vw, 70px);
        letter-spacing: -0.04em;
      }

      .xrp-price {
        font-size: clamp(28px, 9vw, 48px);
        letter-spacing: -0.04em;
      }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      .app {
        padding: 10px 70px;
      }

      .price {
        font-size: clamp(43px, 15.6vh, 96px);
      }

      .xrp-price {
        margin-top: 10px;
        font-size: clamp(28px, 10vh, 58px);
      }

      button {
        width: 40px;
        height: 40px;
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <div id="time" class="time">--:--</div>

    <div id="btcPrice" class="price">---</div>
    <div id="xrpPrice" class="xrp-price">---</div>

    <div id="dot" class="dot"></div>

    <div class="controls">
      <button type="button" onclick="manualRefresh()" aria-label="Refresh">↻</button>
      <button type="button" onclick="goFullscreen()" aria-label="Fullscreen">⛶</button>
    </div>
  </main>

  <script>
    const SYMBOLS = ["BTCPHP", "XRPPHP"];

    const timeEl = document.getElementById("time");
    const btcPriceEl = document.getElementById("btcPrice");
    const xrpPriceEl = document.getElementById("xrpPrice");
    const dotEl = document.getElementById("dot");

    const sockets = {};
    const lastUpdateAt = {
      BTCPHP: 0,
      XRPPHP: 0
    };

    let reconnectTimer = null;
    let fallbackTimer = null;
    let timeTimer = null;

    let reconnectAttempts = 0;
    let manualClose = false;

    function updateTime() {
      const now = new Date();

      timeEl.textContent = now.toLocaleTimeString("en-PH", {
        hour: "numeric",
        minute: "2-digit",
        hour12: true
      }).toLowerCase();
    }

    function setDot(state) {
      dotEl.className = `dot ${state}`;
    }

    function formatNumber(value) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "--";
      }

      return number.toFixed(2);
    }

    function getWsUrl(symbol) {
      return `wss://wsapi.pro.coins.ph/openapi/quote/ws/v3/${symbol.toLowerCase()}@ticker`;
    }

    function getRestUrl(symbol) {
      return `https://api.pro.coins.ph/openapi/quote/v1/ticker/24hr?symbol=${symbol}`;
    }

    function normalize(payload, symbol) {
      let data = payload && payload.data ? payload.data : payload;

      if (Array.isArray(data)) {
        data = data.find(item => String(item.symbol || item.s).toUpperCase() === symbol);
      }

      if (!data || typeof data !== "object") {
        return null;
      }

      return {
        symbol: String(data.symbol || data.s || symbol).toUpperCase(),
        last: data.c || data.lastPrice
      };
    }

    function render(payload, source, expectedSymbol) {
      const data = normalize(payload, expectedSymbol);

      if (!data) {
        return;
      }

      if (data.symbol === "BTCPHP") {
        btcPriceEl.textContent = formatNumber(data.last);
      }

      if (data.symbol === "XRPPHP") {
        xrpPriceEl.textContent = formatNumber(data.last);
      }

      lastUpdateAt[data.symbol] = Date.now();
      setDot(source === "ws" ? "live" : "warn");
    }

    async function fetchRest(symbol) {
      const response = await fetch(`${getRestUrl(symbol)}&_=${Date.now()}`, {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(`REST ${response.status}`);
      }

      const payload = await response.json();
      render(payload, "rest", symbol);
    }

    async function fetchAllRest() {
      await Promise.allSettled(SYMBOLS.map(symbol => fetchRest(symbol)));
    }

    function clearSocket(symbol) {
      const socket = sockets[symbol];

      if (!socket) {
        return;
      }

      socket.onopen = null;
      socket.onmessage = null;
      socket.onerror = null;
      socket.onclose = null;

      try {
        socket.close();
      } catch (_) {}

      sockets[symbol] = null;
    }

    function clearAllSockets() {
      SYMBOLS.forEach(clearSocket);
    }

    function clearReconnect() {
      clearTimeout(reconnectTimer);
      reconnectTimer = null;
    }

    function connectSocket(symbol) {
      clearSocket(symbol);
      setDot("warn");

      try {
        sockets[symbol] = new WebSocket(getWsUrl(symbol));
      } catch (_) {
        scheduleReconnect();
        return;
      }

      sockets[symbol].onopen = () => {
        reconnectAttempts = 0;
        setDot("live");
      };

      sockets[symbol].onmessage = event => {
        try {
          const payload = JSON.parse(event.data);

          if (payload.pong || payload.result === null) {
            return;
          }

          render(payload, "ws", symbol);
        } catch (_) {}
      };

      sockets[symbol].onerror = () => {
        setDot("warn");
      };

      sockets[symbol].onclose = () => {
        if (!manualClose) {
          scheduleReconnect();
        }
      };
    }

    function connectAllSockets() {
      clearReconnect();
      clearAllSockets();

      manualClose = false;
      SYMBOLS.forEach(connectSocket);
    }

    function scheduleReconnect() {
      clearReconnect();

      reconnectAttempts += 1;
      setDot("dead");

      const delay = Math.min(30000, reconnectAttempts * 3000);

      reconnectTimer = setTimeout(() => {
        connectAllSockets();
      }, delay);
    }

    async function manualRefresh() {
      manualClose = true;
      reconnectAttempts = 0;

      clearReconnect();
      clearAllSockets();

      try {
        await fetchAllRest();
      } catch (_) {
        setDot("dead");
      }

      connectAllSockets();
    }

    function startFallback() {
      clearInterval(fallbackTimer);

      fallbackTimer = setInterval(async () => {
        const staleSymbols = SYMBOLS.filter(symbol => {
          return Date.now() - lastUpdateAt[symbol] > 20000;
        });

        if (!staleSymbols.length) {
          return;
        }

        try {
          await Promise.allSettled(staleSymbols.map(symbol => fetchRest(symbol)));
        } catch (_) {
          setDot("dead");
        }
      }, 15000);
    }

    async function goFullscreen() {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
      } catch (_) {}
    }

    window.addEventListener("beforeunload", () => {
      manualClose = true;

      clearReconnect();
      clearAllSockets();
      clearInterval(fallbackTimer);
      clearInterval(timeTimer);
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        updateTime();

        const needsReconnect = SYMBOLS.some(symbol => {
          const socket = sockets[symbol];
          return !socket || socket.readyState === WebSocket.CLOSED;
        });

        if (needsReconnect) {
          connectAllSockets();
        }

        fetchAllRest().catch(() => setDot("warn"));
      }
    });

    updateTime();
    timeTimer = setInterval(updateTime, 1000);

    fetchAllRest().catch(() => setDot("warn"));
    startFallback();
    connectAllSockets();
  </script>
</body>
</html>
