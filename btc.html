<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BTC/PHP Price - Coins.ph</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: 100%;
      height: 100%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .label {
      font-size: clamp(18px, 3vw, 36px);
      letter-spacing: 0.12em;
      opacity: 0.75;
      margin-bottom: 16px;
    }

    .price {
      font-size: clamp(48px, 13vw, 180px);
      font-weight: 800;
      line-height: 1;
      margin: 8px 0 20px;
      word-break: break-word;
    }

    .change {
      font-size: clamp(18px, 4vw, 48px);
      margin-bottom: 18px;
    }

    .positive {
      color: #fff;
    }

    .negative {
      color: #aaa;
    }

    .details {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
      font-size: clamp(14px, 2vw, 22px);
      opacity: 0.85;
      margin-bottom: 28px;
    }

    .status {
      font-size: clamp(12px, 1.8vw, 18px);
      opacity: 0.65;
      margin-bottom: 18px;
      min-height: 24px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      background: #fff;
      color: #000;
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }

    .small {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      font-size: 12px;
      opacity: 0.45;
      text-align: center;
    }

    @media (max-width: 480px) {
      .app {
        padding: 16px;
      }

      .buttons {
        flex-direction: column;
        width: 100%;
        max-width: 300px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="label">COINS.PH BTC/PHP</div>

    <div id="price" class="price">Loading...</div>

    <div id="change" class="change">--</div>

    <div class="details">
      <div>Bid: <span id="bid">--</span></div>
      <div>Ask: <span id="ask">--</span></div>
      <div>High: <span id="high">--</span></div>
      <div>Low: <span id="low">--</span></div>
    </div>

    <div id="status" class="status">Starting price monitor...</div>

    <div class="buttons">
      <button onclick="refreshNow()">Refresh Now</button>
      <button onclick="goFullscreen()">Fullscreen</button>
      <button onclick="keepScreenAwake()">Keep Screen On</button>
    </div>

    <div class="small">
      This display refreshes automatically. Fullscreen and wake lock may require tapping the buttons first.
    </div>
  </main>

  <script>
    const SYMBOL = "BTCPHP";
    const REFRESH_MS = 5000;

    const priceEl = document.getElementById("price");
    const changeEl = document.getElementById("change");
    const bidEl = document.getElementById("bid");
    const askEl = document.getElementById("ask");
    const highEl = document.getElementById("high");
    const lowEl = document.getElementById("low");
    const statusEl = document.getElementById("status");

    let wakeLock = null;
    let lastPrice = null;

    const priceUrl =
      `https://api.pro.coins.ph/openapi/quote/v1/ticker/price?symbol=${SYMBOL}`;

    const statsUrl =
      `https://api.pro.coins.ph/openapi/quote/v1/ticker/24hr?symbol=${SYMBOL}`;

    function formatPHP(value) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "--";
      }

      return new Intl.NumberFormat("en-PH", {
        style: "currency",
        currency: "PHP",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(number);
    }

    function formatPercent(value) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "--";
      }

      const sign = number > 0 ? "+" : "";

      return `${sign}${number.toFixed(2)}%`;
    }

    async function fetchJSON(url) {
      const response = await fetch(url, {
        method: "GET",
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      return response.json();
    }

    async function updatePrice() {
      try {
        statusEl.textContent = "Updating...";

        const [priceData, statsData] = await Promise.all([
          fetchJSON(priceUrl),
          fetchJSON(statsUrl)
        ]);

        const currentPrice = Number(priceData.price);
        const previousPrice = lastPrice;

        lastPrice = currentPrice;

        priceEl.textContent = formatPHP(currentPrice);

        if (previousPrice !== null) {
          if (currentPrice > previousPrice) {
            priceEl.style.opacity = "1";
          } else if (currentPrice < previousPrice) {
            priceEl.style.opacity = "0.75";
          }
        }

        const changePercent = Number(statsData.priceChangePercent);

        changeEl.textContent = `24H ${formatPercent(changePercent)}`;

        if (changePercent >= 0) {
          changeEl.className = "change positive";
        } else {
          changeEl.className = "change negative";
        }

        bidEl.textContent = formatPHP(statsData.bidPrice);
        askEl.textContent = formatPHP(statsData.askPrice);
        highEl.textContent = formatPHP(statsData.highPrice);
        lowEl.textContent = formatPHP(statsData.lowPrice);

        const now = new Date();

        statusEl.textContent =
          `Last updated: ${now.toLocaleTimeString()} | Refresh: ${REFRESH_MS / 1000}s`;
      } catch (error) {
        console.error(error);

        statusEl.textContent =
          "Could not load Coins.ph price. Check internet connection or browser CORS support.";

        priceEl.textContent = "Error";
      }
    }

    async function goFullscreen() {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
      } catch (error) {
        console.error(error);
        statusEl.textContent = "Fullscreen was blocked by the browser.";
      }
    }

    async function keepScreenAwake() {
      try {
        if (!("wakeLock" in navigator)) {
          statusEl.textContent =
            "Wake Lock API is not supported on this browser.";
          return;
        }

        wakeLock = await navigator.wakeLock.request("screen");

        wakeLock.addEventListener("release", () => {
          console.log("Screen wake lock released.");
        });

        statusEl.textContent = "Screen wake lock is active.";
      } catch (error) {
        console.error(error);

        statusEl.textContent =
          "Wake lock failed. Use fullscreen and keep device plugged in.";
      }
    }

    async function refreshNow() {
      await updatePrice();
    }

    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState === "visible" && wakeLock === null) {
        await keepScreenAwake();
      }
    });

    document.addEventListener("click", async () => {
      if (wakeLock === null) {
        await keepScreenAwake();
      }
    }, { once: true });

    updatePrice();
    setInterval(updatePrice, REFRESH_MS);
  </script>
</body>
</html>
