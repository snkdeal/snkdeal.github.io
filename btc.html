<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />

  <title>BTC/PHP</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      height: 100vh;
      height: 100svh;
    }

    .app {
      width: 100%;
      height: 100%;
      padding: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .time {
      position: fixed;
      top: 16px;
      right: 18px;
      font-size: clamp(12px, 3vw, 20px);
      font-weight: 800;
      opacity: 0.55;
      z-index: 5;
    }

    .price {
      width: 100%;
      font-size: clamp(46px, 13.2vw, 168px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.05em;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .alert-status {
      margin-top: 18px;
      min-height: 1.2em;
      font-size: clamp(14px, 3.8vw, 26px);
      font-weight: 800;
      opacity: 0.7;
    }

    .alert-status.triggered {
      color: #ff9f0a;
      opacity: 1;
    }

    .controls {
      position: fixed;
      right: 14px;
      bottom: 14px;
      display: flex;
      gap: 10px;
      z-index: 5;
    }

    button {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      font-size: 23px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:active {
      transform: scale(0.94);
      background: rgba(255, 255, 255, 0.24);
    }

    .dot {
      position: fixed;
      left: 18px;
      bottom: 33px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #666;
      z-index: 5;
    }

    .dot.live {
      background: #30d158;
    }

    .dot.warn {
      background: #ff9f0a;
    }

    .dot.dead {
      background: #ff453a;
    }

    .panel {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: 74px;
      padding: 16px;
      border-radius: 22px;
      background: rgba(28, 28, 30, 0.96);
      backdrop-filter: blur(18px);
      z-index: 10;
      display: none;
      text-align: left;
    }

    .panel.open {
      display: block;
    }

    .panel-title {
      margin-bottom: 14px;
      font-size: 16px;
      font-weight: 900;
      opacity: 0.9;
    }

    .field {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
    }

    .field label {
      font-size: 14px;
      font-weight: 800;
      opacity: 0.7;
    }

    .field input {
      width: 100%;
      min-width: 0;
      padding: 12px 13px;
      border: 0;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      outline: none;
    }

    .field input::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    .panel-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .panel-actions button {
      width: auto;
      height: 44px;
      flex: 1;
      border-radius: 14px;
      font-size: 15px;
    }

    .save-btn {
      background: #30d158;
      color: #000;
    }

    .clear-btn {
      background: rgba(255, 69, 58, 0.26);
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.14);
    }

    @media (max-width: 430px) {
      .app {
        padding: 16px;
      }

      .price {
        font-size: clamp(41px, 14.4vw, 70px);
        letter-spacing: -0.04em;
      }

      .alert-status {
        font-size: clamp(14px, 4.2vw, 20px);
      }

      .field {
        grid-template-columns: 92px 1fr;
      }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      .app {
        padding: 10px 70px;
      }

      .price {
        font-size: clamp(43px, 15.6vh, 96px);
      }

      .alert-status {
        margin-top: 8px;
        font-size: clamp(13px, 4vh, 22px);
      }

      button {
        width: 40px;
        height: 40px;
        font-size: 20px;
      }

      .panel {
        left: 70px;
        right: 70px;
        bottom: 60px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <div id="time" class="time">--:--</div>

    <div id="price" class="price">---</div>
    <div id="alertStatus" class="alert-status"></div>

    <div id="dot" class="dot"></div>

    <div id="alertPanel" class="panel">
      <div class="panel-title">BTC/PHP Price Alert</div>

      <div class="field">
        <label for="aboveInput">Went above</label>
        <input id="aboveInput" type="number" inputmode="decimal" placeholder="optional" />
      </div>

      <div class="field">
        <label for="belowInput">Went below</label>
        <input id="belowInput" type="number" inputmode="decimal" placeholder="optional" />
      </div>

      <div class="panel-actions">
        <button type="button" class="save-btn" onclick="saveAlert()">Save</button>
        <button type="button" class="clear-btn" onclick="clearAlert()">Clear</button>
        <button type="button" class="close-btn" onclick="toggleAlertPanel()">Close</button>
      </div>
    </div>

    <div class="controls">
      <button type="button" onclick="manualRefresh()" aria-label="Refresh">↻</button>
      <button type="button" onclick="toggleAlertPanel()" aria-label="Price alert">!</button>
      <button type="button" onclick="goFullscreen()" aria-label="Fullscreen">⛶</button>
    </div>
  </main>

  <script>
    const SYMBOL = "BTCPHP";
    const STREAM_SYMBOL = SYMBOL.toLowerCase();

    const WS_URL =
      `wss://wsapi.pro.coins.ph/openapi/quote/ws/v3/${STREAM_SYMBOL}@ticker`;

    const REST_URL =
      `https://api.pro.coins.ph/openapi/quote/v1/ticker/24hr?symbol=${SYMBOL}`;

    const ALERT_KEY = "btcphp_price_alert";

    const timeEl = document.getElementById("time");
    const priceEl = document.getElementById("price");
    const alertStatusEl = document.getElementById("alertStatus");
    const alertPanelEl = document.getElementById("alertPanel");
    const aboveInputEl = document.getElementById("aboveInput");
    const belowInputEl = document.getElementById("belowInput");
    const dotEl = document.getElementById("dot");

    let socket = null;
    let reconnectTimer = null;
    let fallbackTimer = null;
    let timeTimer = null;

    let reconnectAttempts = 0;
    let lastUpdateAt = 0;
    let manualClose = false;
    let currentPrice = null;

    let alertConfig = {
      above: null,
      below: null,
      aboveTriggered: false,
      belowTriggered: false
    };

    function updateTime() {
      const now = new Date();

      timeEl.textContent = now.toLocaleTimeString("en-PH", {
        hour: "numeric",
        minute: "2-digit",
        hour12: true
      }).toLowerCase();
    }

    function setDot(state) {
      dotEl.className = `dot ${state}`;
    }

    function formatNumber(value) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "--";
      }

      return number.toFixed(2);
    }

    function normalize(payload) {
      let data = payload && payload.data ? payload.data : payload;

      if (Array.isArray(data)) {
        data = data.find(item => String(item.symbol || item.s).toUpperCase() === SYMBOL);
      }

      if (!data || typeof data !== "object") {
        return null;
      }

      return {
        last: data.c || data.lastPrice
      };
    }

    function parseOptionalPrice(value) {
      const trimmed = String(value || "").trim();

      if (!trimmed) {
        return null;
      }

      const number = Number(trimmed);

      if (!Number.isFinite(number) || number <= 0) {
        return null;
      }

      return number;
    }

    function loadAlert() {
      try {
        const saved = JSON.parse(localStorage.getItem(ALERT_KEY));

        if (!saved || typeof saved !== "object") {
          return;
        }

        alertConfig.above = Number.isFinite(Number(saved.above)) ? Number(saved.above) : null;
        alertConfig.below = Number.isFinite(Number(saved.below)) ? Number(saved.below) : null;
        alertConfig.aboveTriggered = Boolean(saved.aboveTriggered);
        alertConfig.belowTriggered = Boolean(saved.belowTriggered);
      } catch (_) {}
    }

    function persistAlert() {
      localStorage.setItem(ALERT_KEY, JSON.stringify(alertConfig));
    }

    function updateAlertInputs() {
      aboveInputEl.value = alertConfig.above === null ? "" : alertConfig.above;
      belowInputEl.value = alertConfig.below === null ? "" : alertConfig.below;
    }

    function updateAlertStatus(message, triggered) {
      if (message) {
        alertStatusEl.textContent = message;
        alertStatusEl.classList.toggle("triggered", Boolean(triggered));
        return;
      }

      const parts = [];

      if (alertConfig.above !== null) {
        parts.push(`above ${formatNumber(alertConfig.above)}`);
      }

      if (alertConfig.below !== null) {
        parts.push(`below ${formatNumber(alertConfig.below)}`);
      }

      alertStatusEl.textContent = parts.length ? `Alert set: ${parts.join(" / ")}` : "";
      alertStatusEl.classList.remove("triggered");
    }

    function notifyAlert(message) {
      updateAlertStatus(message, true);

      if ("vibrate" in navigator) {
        navigator.vibrate([250, 120, 250]);
      }

      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("BTC/PHP Alert", {
          body: message
        });
      }
    }

    function checkAlert(price) {
      if (!Number.isFinite(price)) {
        return;
      }

      if (
        alertConfig.above !== null &&
        !alertConfig.aboveTriggered &&
        price >= alertConfig.above
      ) {
        alertConfig.aboveTriggered = true;
        persistAlert();
        notifyAlert(`BTC/PHP went above ${formatNumber(alertConfig.above)}`);
      }

      if (
        alertConfig.below !== null &&
        !alertConfig.belowTriggered &&
        price <= alertConfig.below
      ) {
        alertConfig.belowTriggered = true;
        persistAlert();
        notifyAlert(`BTC/PHP went below ${formatNumber(alertConfig.below)}`);
      }
    }

    function render(payload, source) {
      const data = normalize(payload);

      if (!data) {
        return;
      }

      const price = Number(data.last);

      priceEl.textContent = formatNumber(price);
      currentPrice = Number.isFinite(price) ? price : currentPrice;

      checkAlert(currentPrice);

      lastUpdateAt = Date.now();
      setDot(source === "ws" ? "live" : "warn");
    }

    async function fetchRest() {
      const response = await fetch(`${REST_URL}&_=${Date.now()}`, {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(`REST ${response.status}`);
      }

      const payload = await response.json();
      render(payload, "rest");
    }

    function clearSocketOnly() {
      if (!socket) {
        return;
      }

      socket.onopen = null;
      socket.onmessage = null;
      socket.onerror = null;
      socket.onclose = null;

      try {
        socket.close();
      } catch (_) {}

      socket = null;
    }

    function clearReconnect() {
      clearTimeout(reconnectTimer);
      reconnectTimer = null;
    }

    function connectSocket() {
      clearReconnect();
      clearSocketOnly();

      manualClose = false;
      setDot("warn");

      try {
        socket = new WebSocket(WS_URL);
      } catch (_) {
        scheduleReconnect();
        return;
      }

      socket.onopen = () => {
        reconnectAttempts = 0;
        setDot("live");
      };

      socket.onmessage = event => {
        try {
          const payload = JSON.parse(event.data);

          if (payload.pong || payload.result === null) {
            return;
          }

          render(payload, "ws");
        } catch (_) {}
      };

      socket.onerror = () => {
        setDot("warn");
      };

      socket.onclose = () => {
        if (!manualClose) {
          scheduleReconnect();
        }
      };
    }

    function scheduleReconnect() {
      clearReconnect();

      reconnectAttempts += 1;
      setDot("dead");

      const delay = Math.min(30000, reconnectAttempts * 3000);

      reconnectTimer = setTimeout(() => {
        connectSocket();
      }, delay);
    }

    async function manualRefresh() {
      manualClose = true;
      reconnectAttempts = 0;

      clearReconnect();
      clearSocketOnly();

      try {
        await fetchRest();
      } catch (_) {
        setDot("dead");
      }

      connectSocket();
    }

    function startFallback() {
      clearInterval(fallbackTimer);

      fallbackTimer = setInterval(async () => {
        const stale = Date.now() - lastUpdateAt > 20000;

        if (!stale) {
          return;
        }

        try {
          await fetchRest();
        } catch (_) {
          setDot("dead");
        }
      }, 15000);
    }

    function toggleAlertPanel() {
      alertPanelEl.classList.toggle("open");
    }

    async function saveAlert() {
      const above = parseOptionalPrice(aboveInputEl.value);
      const below = parseOptionalPrice(belowInputEl.value);

      alertConfig = {
        above,
        below,
        aboveTriggered: false,
        belowTriggered: false
      };

      persistAlert();
      updateAlertInputs();
      updateAlertStatus();

      if ("Notification" in window && Notification.permission === "default") {
        try {
          await Notification.requestPermission();
        } catch (_) {}
      }

      if (currentPrice !== null) {
        checkAlert(currentPrice);
      }

      alertPanelEl.classList.remove("open");
    }

    function clearAlert() {
      alertConfig = {
        above: null,
        below: null,
        aboveTriggered: false,
        belowTriggered: false
      };

      localStorage.removeItem(ALERT_KEY);
      updateAlertInputs();
      updateAlertStatus();
    }

    async function goFullscreen() {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
      } catch (_) {}
    }

    window.addEventListener("beforeunload", () => {
      manualClose = true;

      clearReconnect();
      clearSocketOnly();
      clearInterval(fallbackTimer);
      clearInterval(timeTimer);
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        updateTime();

        if (!socket || socket.readyState === WebSocket.CLOSED) {
          connectSocket();
        }

        fetchRest().catch(() => setDot("warn"));
      }
    });

    loadAlert();
    updateAlertInputs();
    updateAlertStatus();

    updateTime();
    timeTimer = setInterval(updateTime, 1000);

    fetchRest().catch(() => setDot("warn"));
    startFallback();
    connectSocket();
  </script>
</body>
</html>
