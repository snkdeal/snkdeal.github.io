<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />

  <title>BTC/PHP</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      height: 100vh;
      height: 100svh;
    }

    .app {
      width: 100%;
      height: 100%;
      padding: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .time {
      position: fixed;
      top: 16px;
      right: 18px;
      font-size: clamp(12px, 3vw, 20px);
      font-weight: 800;
      opacity: 0.55;
      z-index: 5;
    }

    .price {
      width: 100%;
      font-size: clamp(46px, 13.2vw, 168px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.05em;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .change {
      margin-top: 18px;
      font-size: clamp(22px, 6vw, 56px);
      font-weight: 800;
    }

    .change.up {
      color: #30d158;
    }

    .change.down {
      color: #ff453a;
    }

    .mini {
      margin-top: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      font-size: clamp(13px, 3.5vw, 24px);
      font-weight: 700;
      opacity: 0.55;
    }

    .controls {
      position: fixed;
      right: 14px;
      bottom: 14px;
      display: flex;
      gap: 10px;
      z-index: 5;
    }

    button {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      font-size: 23px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:active {
      transform: scale(0.94);
      background: rgba(255, 255, 255, 0.24);
    }

    .dot {
      position: fixed;
      left: 18px;
      bottom: 33px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #666;
      z-index: 5;
    }

    .dot.live {
      background: #30d158;
    }

    .dot.warn {
      background: #ff9f0a;
    }

    .dot.dead {
      background: #ff453a;
    }

    @media (max-width: 430px) {
      .app {
        padding: 16px;
      }

      .price {
        font-size: clamp(41px, 14.4vw, 70px);
        letter-spacing: -0.04em;
      }

      .change {
        font-size: clamp(22px, 7vw, 36px);
      }

      .mini {
        gap: 12px;
      }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      .app {
        padding: 10px 70px;
      }

      .price {
        font-size: clamp(43px, 15.6vh, 96px);
      }

      .change {
        margin-top: 8px;
        font-size: clamp(20px, 8vh, 42px);
      }

      .mini {
        margin-top: 8px;
      }

      button {
        width: 40px;
        height: 40px;
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <div id="time" class="time">--:--</div>

    <div id="price" class="price">---</div>

    <div id="change" class="change">--</div>

    <div class="mini">
      <div>B <span id="bid">--</span></div>
      <div>A <span id="ask">--</span></div>
    </div>

    <div id="dot" class="dot"></div>

    <div class="controls">
      <button type="button" onclick="manualRefresh()" aria-label="Refresh">↻</button>
      <button type="button" onclick="goFullscreen()" aria-label="Fullscreen">⛶</button>
    </div>
  </main>

  <script>
    const SYMBOL = "BTCPHP";
    const STREAM_SYMBOL = SYMBOL.toLowerCase();

    const WS_URL =
      `wss://wsapi.pro.coins.ph/openapi/quote/ws/v3/${STREAM_SYMBOL}@ticker`;

    const REST_URL =
      `https://api.pro.coins.ph/openapi/quote/v1/ticker/24hr?symbol=${SYMBOL}`;

    const timeEl = document.getElementById("time");
    const priceEl = document.getElementById("price");
    const changeEl = document.getElementById("change");
    const bidEl = document.getElementById("bid");
    const askEl = document.getElementById("ask");
    const dotEl = document.getElementById("dot");

    let socket = null;
    let reconnectTimer = null;
    let fallbackTimer = null;
    let timeTimer = null;

    let reconnectAttempts = 0;
    let lastUpdateAt = 0;
    let manualClose = false;

    function updateTime() {
      const now = new Date();

      timeEl.textContent = now.toLocaleTimeString("en-PH", {
        hour: "numeric",
        minute: "2-digit",
        hour12: true
      }).toLowerCase();
    }

    function setDot(state) {
      dotEl.className = `dot ${state}`;
    }

    function formatNumber(value) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "--";
      }

      return number.toFixed(2);
    }

    function formatPercent(value) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "--";
      }

      return `${number > 0 ? "+" : ""}${number.toFixed(2)}%`;
    }

    function normalize(payload) {
      let data = payload && payload.data ? payload.data : payload;

      if (Array.isArray(data)) {
        data = data.find(item => String(item.symbol || item.s).toUpperCase() === SYMBOL);
      }

      if (!data || typeof data !== "object") {
        return null;
      }

      return {
        last: data.c || data.lastPrice,
        change: data.P || data.priceChangePercent,
        bid: data.b || data.bidPrice,
        ask: data.a || data.askPrice
      };
    }

    function render(payload, source) {
      const data = normalize(payload);

      if (!data) {
        return;
      }

      const change = Number(data.change);

      priceEl.textContent = formatNumber(data.last);
      changeEl.textContent = formatPercent(data.change);
      bidEl.textContent = formatNumber(data.bid);
      askEl.textContent = formatNumber(data.ask);

      changeEl.classList.toggle("up", Number.isFinite(change) && change > 0);
      changeEl.classList.toggle("down", Number.isFinite(change) && change < 0);

      lastUpdateAt = Date.now();
      setDot(source === "ws" ? "live" : "warn");
    }

    async function fetchRest() {
      const response = await fetch(`${REST_URL}&_=${Date.now()}`, {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(`REST ${response.status}`);
      }

      const payload = await response.json();
      render(payload, "rest");
    }

    function clearSocketOnly() {
      if (!socket) {
        return;
      }

      socket.onopen = null;
      socket.onmessage = null;
      socket.onerror = null;
      socket.onclose = null;

      try {
        socket.close();
      } catch (_) {}

      socket = null;
    }

    function clearReconnect() {
      clearTimeout(reconnectTimer);
      reconnectTimer = null;
    }

    function connectSocket() {
      clearReconnect();
      clearSocketOnly();

      manualClose = false;
      setDot("warn");

      try {
        socket = new WebSocket(WS_URL);
      } catch (_) {
        scheduleReconnect();
        return;
      }

      socket.onopen = () => {
        reconnectAttempts = 0;
        setDot("live");
      };

      socket.onmessage = event => {
        try {
          const payload = JSON.parse(event.data);

          if (payload.pong || payload.result === null) {
            return;
          }

          render(payload, "ws");
        } catch (_) {}
      };

      socket.onerror = () => {
        setDot("warn");
      };

      socket.onclose = () => {
        if (!manualClose) {
          scheduleReconnect();
        }
      };
    }

    function scheduleReconnect() {
      clearReconnect();

      reconnectAttempts += 1;
      setDot("dead");

      const delay = Math.min(30000, reconnectAttempts * 3000);

      reconnectTimer = setTimeout(() => {
        connectSocket();
      }, delay);
    }

    async function manualRefresh() {
      manualClose = true;
      reconnectAttempts = 0;

      clearReconnect();
      clearSocketOnly();

      try {
        await fetchRest();
      } catch (_) {
        setDot("dead");
      }

      connectSocket();
    }

    function startFallback() {
      clearInterval(fallbackTimer);

      fallbackTimer = setInterval(async () => {
        const stale = Date.now() - lastUpdateAt > 20000;

        if (!stale) {
          return;
        }

        try {
          await fetchRest();
        } catch (_) {
          setDot("dead");
        }
      }, 15000);
    }

    async function goFullscreen() {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
      } catch (_) {}
    }

    window.addEventListener("beforeunload", () => {
      manualClose = true;

      clearReconnect();
      clearSocketOnly();
      clearInterval(fallbackTimer);
      clearInterval(timeTimer);
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        updateTime();

        if (!socket || socket.readyState === WebSocket.CLOSED) {
          connectSocket();
        }

        fetchRest().catch(() => setDot("warn"));
      }
    });

    updateTime();
    timeTimer = setInterval(updateTime, 1000);

    fetchRest().catch(() => setDot("warn"));
    startFallback();
    connectSocket();
  </script>
</body>
</html>
