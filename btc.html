<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>BTC/PHP Live Price - Coins.ph</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen {
      width: 100%;
      height: 100%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .pair {
      font-size: clamp(20px, 4vw, 52px);
      letter-spacing: 0.14em;
      font-weight: 700;
      opacity: 0.85;
      margin-bottom: 24px;
    }

    .price {
      font-size: clamp(52px, 15vw, 210px);
      font-weight: 900;
      line-height: 0.95;
      margin-bottom: 28px;
      word-break: break-word;
    }

    .change {
      font-size: clamp(24px, 5vw, 70px);
      font-weight: 700;
      margin-bottom: 28px;
    }

    .details {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px;
      font-size: clamp(15px, 2.4vw, 30px);
      opacity: 0.85;
      margin-bottom: 30px;
    }

    .status {
      font-size: clamp(13px, 2vw, 22px);
      opacity: 0.65;
      min-height: 28px;
      margin-bottom: 24px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      background: #fff;
      color: #000;
      border: 0;
      border-radius: 999px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }

    .footer {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 10px;
      text-align: center;
      font-size: 12px;
      opacity: 0.45;
    }

    @media (max-width: 520px) {
      .screen {
        padding: 14px;
      }

      .buttons {
        width: 100%;
        max-width: 320px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="screen">
    <div class="pair">COINS.PH BTC/PHP</div>

    <div id="price" class="price">Connecting...</div>

    <div id="change" class="change">24H --</div>

    <div class="details">
      <div>Bid: <span id="bid">--</span></div>
      <div>Ask: <span id="ask">--</span></div>
      <div>High: <span id="high">--</span></div>
      <div>Low: <span id="low">--</span></div>
    </div>

    <div id="status" class="status">Opening Coins.ph live stream...</div>

    <div class="buttons">
      <button onclick="connectSocket()">Reconnect</button>
      <button onclick="goFullscreen()">Fullscreen</button>
      <button onclick="keepScreenAwake()">Keep Screen On</button>
    </div>

    <div class="footer">
      Live data from Coins.ph WebSocket. Tap Keep Screen On and Fullscreen for monitor mode.
    </div>
  </main>

  <script>
    const SYMBOL = "BTCPHP";
    const STREAM_SYMBOL = "btcphp";

    const WS_URL =
      `wss://wsapi.pro.coins.ph/openapi/quote/ws/v3/${STREAM_SYMBOL}@ticker`;

    const REST_24H_URL =
      `https://api.pro.coins.ph/openapi/quote/v1/ticker/24hr?symbol=${SYMBOL}`;

    const priceEl = document.getElementById("price");
    const changeEl = document.getElementById("change");
    const bidEl = document.getElementById("bid");
    const askEl = document.getElementById("ask");
    const highEl = document.getElementById("high");
    const lowEl = document.getElementById("low");
    const statusEl = document.getElementById("status");

    let socket = null;
    let wakeLock = null;
    let reconnectTimer = null;
    let pingTimer = null;

    function formatPHP(value) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "--";
      }

      return new Intl.NumberFormat("en-PH", {
        style: "currency",
        currency: "PHP",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(number);
    }

    function formatPercent(value) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "--";
      }

      const sign = number > 0 ? "+" : "";

      return `${sign}${number.toFixed(2)}%`;
    }

    function updateDisplay(data) {
      /*
        Coins.ph btcphp@ticker fields:
        c = last price
        P = 24h price change percent
        b = best bid
        a = best ask
        h = 24h high
        l = 24h low
      */

      priceEl.textContent = formatPHP(data.c);
      changeEl.textContent = `24H ${formatPercent(data.P)}`;

      bidEl.textContent = formatPHP(data.b);
      askEl.textContent = formatPHP(data.a);
      highEl.textContent = formatPHP(data.h);
      lowEl.textContent = formatPHP(data.l);

      const now = new Date();

      statusEl.textContent =
        `Live | Last update: ${now.toLocaleTimeString()}`;
    }

    async function loadInitialRestData() {
      try {
        const response = await fetch(REST_24H_URL, {
          method: "GET",
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`REST HTTP ${response.status}`);
        }

        const data = await response.json();

        updateDisplay({
          c: data.lastPrice,
          P: data.priceChangePercent,
          b: data.bidPrice,
          a: data.askPrice,
          h: data.highPrice,
          l: data.lowPrice
        });
      } catch (error) {
        console.warn("REST fallback failed:", error);
        statusEl.textContent =
          "REST failed. Waiting for WebSocket live price...";
      }
    }

    function connectSocket() {
      clearTimeout(reconnectTimer);
      clearInterval(pingTimer);

      if (socket) {
        try {
          socket.close();
        } catch (error) {
          console.warn(error);
        }
      }

      statusEl.textContent = "Connecting to Coins.ph WebSocket...";

      socket = new WebSocket(WS_URL);

      socket.onopen = () => {
        statusEl.textContent = "Connected. Waiting for live BTC/PHP price...";

        /*
          Coins.ph docs say the connection uses ping frames.
          Browser JavaScript cannot send native WebSocket ping frames,
          so this sends a JSON ping message every 4 minutes.
        */
        pingTimer = setInterval(() => {
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ ping: Date.now() }));
          }
        }, 240000);
      };

      socket.onmessage = event => {
        try {
          const data = JSON.parse(event.data);

          if (data.pong) {
            return;
          }

          updateDisplay(data);
        } catch (error) {
          console.warn("Bad WebSocket message:", event.data);
        }
      };

      socket.onerror = error => {
        console.error("WebSocket error:", error);
        statusEl.textContent = "WebSocket error. Reconnecting...";
      };

      socket.onclose = () => {
        clearInterval(pingTimer);

        statusEl.textContent = "Disconnected. Reconnecting...";

        reconnectTimer = setTimeout(() => {
          connectSocket();
        }, 3000);
      };
    }

    async function goFullscreen() {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
      } catch (error) {
        console.error(error);
        statusEl.textContent =
          "Fullscreen blocked. Tap the button again or check browser settings.";
      }
    }

    async function keepScreenAwake() {
      try {
        if (!("wakeLock" in navigator)) {
          statusEl.textContent =
            "Screen Wake Lock is not supported on this browser.";
          return;
        }

        wakeLock = await navigator.wakeLock.request("screen");

        wakeLock.addEventListener("release", () => {
          wakeLock = null;
          statusEl.textContent = "Screen wake lock released.";
        });

        statusEl.textContent = "Screen wake lock active.";
      } catch (error) {
        console.error(error);
        statusEl.textContent =
          "Wake lock failed. Use fullscreen and keep the device plugged in.";
      }
    }

    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState === "visible" && wakeLock === null) {
        try {
          await keepScreenAwake();
        } catch (error) {
          console.warn(error);
        }
      }
    });

    loadInitialRestData();
    connectSocket();
  </script>
</body>
</html>
