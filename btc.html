<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>BTC/PHP</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app">
    <form id="pairForm" class="pair-form">
      <input
        id="pairInput"
        class="pair-input"
        type="text"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
        placeholder="BTC"
        aria-label="Coin or pair"
      />
    </form>

    <div id="time" class="time">--:--</div>

    <section class="quote">
      <div id="pairLabel" class="pair-label">BTC/PHP</div>
      <div id="price" class="price">---</div>
      <div id="range" class="range"></div>
      <div id="alertStatus" class="alert-status"></div>
    </section>

    <div id="dot" class="dot"></div>

    <div id="alertPanel" class="panel">
      <div id="panelTitle" class="panel-title">BTC/PHP Price Alert</div>

      <div class="field">
        <label for="aboveInput">Went above</label>
        <input id="aboveInput" type="number" inputmode="decimal" placeholder="optional" />
      </div>

      <div class="field">
        <label for="belowInput">Went below</label>
        <input id="belowInput" type="number" inputmode="decimal" placeholder="optional" />
      </div>

      <label class="check-row">
        <input id="repeatInput" type="checkbox" />
        repeat every crossing
      </label>

      <div class="panel-actions">
        <button type="button" id="saveAlertBtn">Save</button>
        <button type="button" id="clearAlertBtn">Clear</button>
        <button type="button" id="closeAlertBtn">Close</button>
      </div>
    </div>

    <div class="controls">
      <button type="button" id="refreshBtn" aria-label="Refresh">↻</button>
      <button type="button" id="alertBtn" aria-label="Price alert">!</button>
      <button type="button" id="fullscreenBtn" aria-label="Fullscreen">⛶</button>
    </div>
  </main>

  <script src="app.js" defer></script>
</body>
